# COSMIC is a Wayland-only session, so bypass the VT switch in nvidia-sleep.sh.
#
# nvidia-sleep.sh runs "chvt 63" before writing to /proc/driver/nvidia/suspend.
# That exists to make the NVIDIA X driver release the GPU -- NVIDIA's own docs
# say the script "manages VT switching for the X server". On a Wayland session
# it just deactivates the logind session, and cosmic-comp does not survive
# losing DRM master across a suspend: it page-flips before logind re-grants the
# devices, takes EACCES, and escalates to a permanent "Device lost" on every
# card, leaving a frozen desktop that only a compositor restart clears.
#
# See https://github.com/pop-os/cosmic-comp/issues/2078 (cosmic-comp never
# subscribes to logind's PrepareForSleep, unlike mutter/kwin) and
# https://github.com/pop-os/cosmic-epoch/issues/3012 (same failure, hybrid
# Intel+NVIDIA). Drop this file once cosmic-comp handles suspend properly, or
# once NVIDIA retires nvidia-sleep.sh as it has signalled it intends to.
#
# The resume path is deliberately left alone: nvidia-resume.service and
# /usr/lib/systemd/system-sleep/nvidia still call nvidia-sleep.sh "resume",
# whose RestoreVT is a no-op because the suspend side never records a VT.
[Service]
ExecStart=
ExecStart=/usr/bin/logger -t suspend -s "nvidia-suspend-then-hibernate.service (COSMIC: VT switch bypassed)"
ExecStart=/bin/sh -c 'if [ -f /proc/driver/nvidia/suspend ]; then echo suspend > /proc/driver/nvidia/suspend; fi'
